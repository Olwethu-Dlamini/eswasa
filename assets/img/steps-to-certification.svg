<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" fill="none">
  <defs>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="50%" stop-color="#8E44AD"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <filter id="pill-shadow" x="-8%" y="-15%" width="116%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED1C24"/><stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E44AD"/><stop offset="100%" stop-color="#BB6BD9"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27AE60"/><stop offset="100%" stop-color="#6FCF97"/>
    </linearGradient>
  </defs>

  <!-- Connecting line (behind pills, shows through the gaps) -->
  <line x1="64" y1="100" x2="684" y2="100" stroke="url(#pathGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- Pill 1: Documentation -->
  <g filter="url(#pill-shadow)">
    <rect x="30" y="68" width="280" height="64" rx="32" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
    <circle cx="64" cy="100" r="22" fill="url(#grad2)" filter="url(#icon-glow)"/>
    <g transform="translate(64,100)">
      <rect x="-7" y="-9" width="14" height="18" rx="2" fill="none" stroke="white" stroke-width="1.8"/>
      <line x1="-4" y1="-4" x2="4" y2="-4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="4" x2="2" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="98" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#333">Documentation</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M320,93 L328,100 L320,107" fill="none" stroke="#8E44AD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Pill 2: Implementation -->
  <g filter="url(#pill-shadow)">
    <rect x="340" y="68" width="280" height="64" rx="32" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
    <circle cx="374" cy="100" r="22" fill="url(#grad3)" filter="url(#icon-glow)"/>
    <g transform="translate(374,100)">
      <circle cx="0" cy="0" r="4" fill="none" stroke="white" stroke-width="1.8"/>
      <g stroke="white" stroke-width="2.2" stroke-linecap="round">
        <line x1="0" y1="-9" x2="0" y2="-6"/><line x1="0" y1="6" x2="0" y2="9"/>
        <line x1="-9" y1="0" x2="-6" y2="0"/><line x1="6" y1="0" x2="9" y2="0"/>
        <line x1="-6.4" y1="-6.4" x2="-4.2" y2="-4.2"/><line x1="4.2" y1="4.2" x2="6.4" y2="6.4"/>
        <line x1="6.4" y1="-6.4" x2="4.2" y2="-4.2"/><line x1="-4.2" y1="4.2" x2="-6.4" y2="6.4"/>
      </g>
    </g>
    <text x="408" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#333">Implementation</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M630,93 L638,100 L630,107" fill="none" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Pill 3: Certification Audit -->
  <g filter="url(#pill-shadow)">
    <rect x="650" y="68" width="280" height="64" rx="32" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
    <circle cx="684" cy="100" r="22" fill="url(#grad5)" filter="url(#icon-glow)"/>
    <g transform="translate(684,100)">
      <circle cx="0" cy="-3" r="7" fill="none" stroke="white" stroke-width="1.8"/>
      <polyline points="-4,4 -5,11 0,8 5,11 4,4" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <text x="718" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#333">Certification Audit</text>
  </g>
</svg>
