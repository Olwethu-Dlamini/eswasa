<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="No photograph available">
  <!--
    Neutral avatar placeholder for team members without a usable photograph.
    Used by Meetourteam.php both as the empty-value fallback and as the
    onerror target when a stored filename no longer exists on disk.
    The previous fallback (assets/img/instructor/instructor01.png) was itself
    missing, so both cases produced a broken-image icon.
    See docs/superpowers/specs/2026-08-18-cms-batch-a-design.md (A9).
  -->
  <rect width="400" height="400" fill="#e9ecef"/>
  <circle cx="200" cy="158" r="66" fill="#adb5bd"/>
  <path d="M200 244c-63 0-114 40-114 90v66h228v-66c0-50-51-90-114-90z" fill="#adb5bd"/>
</svg>
