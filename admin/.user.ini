; ESWASA — PHP upload limits (Plesk).
;
; Matches the 16 MB file limit set in Plesk › Domains › <domain> › PHP Settings.
; Keep these three numbers in step; if you raise the limit in Plesk, raise it
; here too, or whichever is LOWER silently wins.
;
;   upload_max_filesize  the biggest single file
;   post_max_size        the whole request: file + every text field + multipart
;                        overhead. Must stay ABOVE upload_max_filesize, or a
;                        file at exactly the limit still gets thrown away.
;
; Read by PHP running as FPM, FastCGI or CGI — which is how Plesk serves PHP by
; default. Apache mod_php ignores .user.ini; the guarded php_value lines in
; .htaccess cover that setup instead.
;
; Note: Plesk caches .user.ini for up to 5 minutes (user_ini.cache_ttl), so a
; change here is not visible on the admin page immediately.

upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
